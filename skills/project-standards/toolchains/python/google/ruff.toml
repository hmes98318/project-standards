line-length = 80

[lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "N",
  "D",
  "UP",
  "B",
  "C4",
  "SIM",
  "PTH",
  "RET",
  "PIE",
  "PT",
  "ASYNC",
  "TID",
  "RUF",
  "PGH",
  "G",
  "S",
  "BLE",
  "PLC0415",
]
ignore = ["E501", "D105", "D107", "S101", "UP031", "UP032"]

[lint.pydocstyle]
convention = "google"

[lint.isort]
force-single-line = true
single-line-exclusions = ["typing", "collections.abc", "typing_extensions"]
force-sort-within-sections = true
order-by-type = false

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.per-file-ignores]
"**/{test_*,*_test,conftest}.py" = ["D1", "S"]
"tests/**" = ["D1", "S"]
