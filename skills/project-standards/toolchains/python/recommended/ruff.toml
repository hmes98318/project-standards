[lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "C4",
  "SIM",
  "PTH",
  "RET",
  "PIE",
  "PT",
  "ASYNC",
  "TID",
  "RUF",
  "PGH",
  "G",
  "S",
]
ignore = ["E501"]

[lint.isort]
combine-as-imports = true

[lint.per-file-ignores]
"**/{test_*,*_test,conftest}.py" = ["S"]
"tests/**" = ["S"]
